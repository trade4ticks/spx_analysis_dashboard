<!doctype html>
<meta charset="utf-8">
<title>Replay — render capacity</title>
<!--
  HOW MANY TRADES CAN BE DRAWN, and does the full session need a strategy?

  The Replay chart is one bubble per trade, area proportional to share count,
  plus two NBBO step lines. Two views with completely different demands:

    zoomed (1-3 minutes)  every print individually visible. NO aggregation,
                          no bucketing, no downsampling. This is the view the
                          tool exists for.
    full session          100k-742k trades. Nobody can see an individual print
                          here; it exists to show where to zoom.

  So the question is not "can it draw 742k bubbles" in the abstract. It is
  where the exact path stops being affordable, because that number is the
  threshold at which the server should stop sending every row.

  MEASURED, not assumed, and measured on the machine that will run it.

  Four strategies, because "use canvas" is not a plan:

    arc        ctx.arc() per trade. The obvious one, and the one a chart
               library does. Exact.
    path       one Path2D, every circle added as a sub-path, filled once.
               Exact, and far fewer draw calls.
    rect       fillRect instead of a circle. Exact in POSITION and AREA, and
               at the radii a full session produces -- under a pixel and a
               half -- a circle and a square are the same handful of pixels.
    envelope   per pixel column, the min and max trade price and the largest
               print. NOT for the zoomed view. This is the overview strategy,
               and it is here to be measured against the exact ones so the
               choice is a number rather than a preference.
-->
<style>
  :root { --bg:#14181d; --panel:#1b2027; --line:#2a313a; --ink:#c8d2dc;
          --dim:#7c8894; --blue:#3498db; --pink:#e84393; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px/1.5 "SF Mono", Menlo, Consolas, monospace; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:15px; font-weight:600; color:#fff; }
  header p { margin:0; color:var(--dim); font-size:12px; }
  #controls { padding:12px 18px; display:flex; gap:14px; align-items:center;
              border-bottom:1px solid var(--line); }
  label { color:var(--dim); }
  input { background:var(--panel); color:var(--ink); border:1px solid var(--line);
          border-radius:3px; padding:4px 6px; font:inherit; width:190px; }
  button { background:var(--blue); color:#04121c; border:0; padding:7px 14px;
           border-radius:4px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { background:#33414d; color:var(--dim); cursor:default; }
  #status { padding:10px 18px; color:var(--pink); min-height:19px; }
  table { border-collapse:collapse; margin:4px 18px 24px; font-size:12px; }
  th,td { padding:4px 10px; text-align:right; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  th:first-child, td:first-child { text-align:left; }
  td.ok { color:#6bd6a0; } td.bad { color:#ff6b6b; }
  #stage { margin:0 18px 18px; border:1px solid var(--line);
           background:var(--panel); }
  canvas { display:block; }
</style>

<header>
  <h1>Replay — render capacity</h1>
  <p>One bubble per trade, area &prop; share count, plus two NBBO step lines.
     Frame time is taken from requestAnimationFrame during a sustained pan, so
     it includes paint.</p>
</header>

<div id="controls">
  <label>trades <input id="counts" value="2000,20000,100000,300000,742333"></label>
  <label>pan frames <input id="frames" value="30" style="width:56px"></label>
  <button id="go">Run</button>
  <span id="note" style="color:var(--dim)"></span>
</div>

<div id="status"></div>
<table id="out"><thead><tr>
  <th>strategy</th><th>trades</th><th>first draw</th><th>pan p50</th>
  <th>pan p95</th><th>fps</th><th>drawn</th><th>verdict</th>
</tr></thead><tbody></tbody></table>
<div id="stage"></div>

<script>
"use strict";

const W = 1400, H = 620;

// ── a synthetic session ─────────────────────────────────────────────────────
//
// Shaped like a real tape rather than uniform noise, because both the price
// path and the SIZE DISTRIBUTION change what the strategies cost. 91% of this
// tape is odd lots and a handful of prints are 200+, so a size-proportional
// radius spends most of its time on sub-pixel circles and occasionally on a
// large one -- which is exactly the mix that decides whether arc() is
// affordable.
function makeSession(n) {
  const t = new Float64Array(n);
  const p = new Float64Array(n);
  const s = new Float64Array(n);
  const bid = new Float64Array(n);
  const ask = new Float64Array(n);
  let seed = 99991;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

  const session = 6.5 * 3600;           // 09:30-16:00 in seconds
  let price = 100;
  let b = price - 0.02, a = price + 0.02;
  for (let i = 0; i < n; i++) {
    // Trades cluster: a marketable order sweeping venues puts several prints
    // in one millisecond. That clustering is the information the tool exists
    // to show, so the fixture has to contain it.
    const burst = rnd() < 0.18;
    t[i] = i === 0 ? 0 : t[i - 1] + (burst ? 0 : (session / n) * (0.2 + 1.6 * rnd()));
    price += (rnd() - 0.5) * 0.012;
    p[i] = price;
    // Heavy tail: mostly odd lots, occasionally a round lot or better.
    const u = rnd();
    s[i] = u < 0.91 ? 1 + Math.floor(rnd() * 40)
         : u < 0.99 ? 100 + Math.floor(rnd() * 200)
                    : 500 + Math.floor(rnd() * 4000);
    if (rnd() < 0.3) { b = price - 0.01 - rnd() * 0.03; a = price + 0.01 + rnd() * 0.03; }
    bid[i] = b; ask[i] = a;
  }
  return { n, t, p, s, bid, ask };
}

// Area proportional to share count, NOT radius: at r ∝ size a 1-share print
// beside a 200 is invisible, which is the whole objection to how other tools
// draw this.
function radiusFor(size, k) { return k * Math.sqrt(size); }

// ── strategies ──────────────────────────────────────────────────────────────

function drawArc(ctx, d, view) {
  const { x0, x1, y0, y1, k } = view;
  ctx.fillStyle = "rgba(190,198,206,0.55)";
  let drawn = 0;
  for (let i = 0; i < d.n; i++) {
    if (d.t[i] < x0 || d.t[i] > x1) continue;
    const x = ((d.t[i] - x0) / (x1 - x0)) * W;
    const y = H - ((d.p[i] - y0) / (y1 - y0)) * H;
    const r = radiusFor(d.s[i], k);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.283185307179586);
    ctx.fill();
    drawn++;
  }
  return drawn;
}

function drawPath(ctx, d, view) {
  const { x0, x1, y0, y1, k } = view;
  const path = new Path2D();
  let drawn = 0;
  for (let i = 0; i < d.n; i++) {
    if (d.t[i] < x0 || d.t[i] > x1) continue;
    const x = ((d.t[i] - x0) / (x1 - x0)) * W;
    const y = H - ((d.p[i] - y0) / (y1 - y0)) * H;
    const r = radiusFor(d.s[i], k);
    path.moveTo(x + r, y);
    path.arc(x, y, r, 0, 6.283185307179586);
    drawn++;
  }
  ctx.fillStyle = "rgba(190,198,206,0.55)";
  ctx.fill(path);
  return drawn;
}

function drawRect(ctx, d, view) {
  const { x0, x1, y0, y1, k } = view;
  ctx.fillStyle = "rgba(190,198,206,0.55)";
  let drawn = 0;
  for (let i = 0; i < d.n; i++) {
    if (d.t[i] < x0 || d.t[i] > x1) continue;
    const x = ((d.t[i] - x0) / (x1 - x0)) * W;
    const y = H - ((d.p[i] - y0) / (y1 - y0)) * H;
    // Side chosen so AREA matches the circle it replaces, not the diameter.
    const side = radiusFor(d.s[i], k) * 1.7724538509055159;   // sqrt(pi)
    ctx.fillRect(x - side / 2, y - side / 2, side, side);
    drawn++;
  }
  return drawn;
}

// THE OVERVIEW STRATEGY, and it is not for the zoomed view. Per pixel column:
// the price range spanned, plus the largest print in that column drawn at its
// own size. It answers "where is there something to look at", which is the
// only question the full-session view is asked.
function drawEnvelope(ctx, d, view) {
  const { x0, x1, y0, y1, k } = view;
  const lo = new Float64Array(W).fill(Infinity);
  const hi = new Float64Array(W).fill(-Infinity);
  const big = new Float64Array(W);
  const bigY = new Float64Array(W);
  for (let i = 0; i < d.n; i++) {
    if (d.t[i] < x0 || d.t[i] > x1) continue;
    const c = ((d.t[i] - x0) / (x1 - x0)) * W | 0;
    if (c < 0 || c >= W) continue;
    const y = H - ((d.p[i] - y0) / (y1 - y0)) * H;
    if (y < lo[c]) lo[c] = y;
    if (y > hi[c]) hi[c] = y;
    if (d.s[i] > big[c]) { big[c] = d.s[i]; bigY[c] = y; }
  }
  ctx.fillStyle = "rgba(190,198,206,0.34)";
  let drawn = 0;
  for (let c = 0; c < W; c++) {
    if (lo[c] === Infinity) continue;
    ctx.fillRect(c, lo[c], 1, Math.max(1, hi[c] - lo[c]));
    drawn++;
  }
  ctx.fillStyle = "rgba(232,67,147,0.75)";
  for (let c = 0; c < W; c++) {
    if (!big[c]) continue;
    const r = radiusFor(big[c], k);
    if (r < 1.2) continue;
    ctx.fillRect(c - r / 2, bigY[c] - r / 2, r, r);
  }
  return drawn;
}

// The NBBO, as steps that hold their level until the quote changes. Drawn
// behind the trades and measured with them, because "drop them if they are
// expensive" needs a number to be a decision.
function drawNbbo(ctx, d, view) {
  const { x0, x1, y0, y1 } = view;
  for (const [arr, colour] of [[d.bid, "rgba(52,152,219,0.55)"],
                               [d.ask, "rgba(232,67,147,0.55)"]]) {
    ctx.strokeStyle = colour;
    ctx.lineWidth = 1;
    ctx.beginPath();
    let started = false, lastY = 0;
    for (let i = 0; i < d.n; i++) {
      if (d.t[i] < x0 || d.t[i] > x1) continue;
      const x = ((d.t[i] - x0) / (x1 - x0)) * W;
      const y = H - ((arr[i] - y0) / (y1 - y0)) * H;
      if (!started) { ctx.moveTo(x, y); started = true; }
      else { ctx.lineTo(x, lastY); ctx.lineTo(x, y); }   // step, not slope
      lastY = y;
    }
    ctx.stroke();
  }
}

const STRATEGIES = [
  ["arc", drawArc], ["path", drawPath], ["rect", drawRect],
  ["envelope", drawEnvelope],
];

const raf = () => new Promise(requestAnimationFrame);
const pct = (a, q) => a.length ? a[Math.min(a.length - 1, Math.floor(a.length * q))] : NaN;

async function run() {
  const go = document.getElementById("go");
  const status = document.getElementById("status");
  const tbody = document.querySelector("#out tbody");
  go.disabled = true;
  tbody.textContent = "";

  const stage = document.getElementById("stage");
  stage.textContent = "";
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  stage.appendChild(cv);
  const ctx = cv.getContext("2d");

  const counts = document.getElementById("counts").value
    .split(",").map((x) => parseInt(x.trim(), 10)).filter((x) => x > 0);
  const frames = parseInt(document.getElementById("frames").value, 10) || 30;
  const results = [];

  for (const n of counts) {
    status.textContent = `building ${n.toLocaleString()} trades…`;
    await raf();
    const d = makeSession(n);
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < n; i++) { if (d.p[i] < lo) lo = d.p[i]; if (d.p[i] > hi) hi = d.p[i]; }
    const pad = (hi - lo) * 0.05 || 0.01;
    const span = d.t[n - 1];
    // Radius scale: a 100-share print is ~3px across at full session.
    const k = 0.3;

    for (const [name, fn] of STRATEGIES) {
      status.textContent = `${name} — ${n.toLocaleString()} trades…`;
      await raf();
      const view = { x0: 0, x1: span, y0: lo - pad, y1: hi + pad, k };

      ctx.clearRect(0, 0, W, H);
      const t0 = performance.now();
      drawNbbo(ctx, d, view);
      const drawn = fn(ctx, d, view);
      const first = performance.now() - t0;
      await raf();

      // A SUSTAINED PAN. One redraw per animation frame with the window
      // shifted, which is what dragging the chart actually costs -- a single
      // first-draw number says nothing about whether it can be moved.
      const gaps = [];
      let last = performance.now();
      await raf();
      for (let f = 0; f < frames; f++) {
        const shift = span * 0.002 * f;
        const v = { x0: shift, x1: span * 0.35 + shift, y0: lo - pad, y1: hi + pad, k };
        ctx.clearRect(0, 0, W, H);
        drawNbbo(ctx, d, v);
        fn(ctx, d, v);
        await raf();
        const now = performance.now();
        gaps.push(now - last);
        last = now;
      }
      gaps.shift();
      gaps.sort((a, b) => a - b);
      const p50 = pct(gaps, 0.5), p95 = pct(gaps, 0.95);
      const r = { strategy: name, trades: n, first, pan_p50: p50,
                  pan_p95: p95, fps: 1000 / p50, drawn };
      results.push(r);
      addRow(tbody, r);
      await raf();
    }
  }
  status.textContent = "";
  go.disabled = false;
  window.__benchResults = results;
  window.__benchDone = true;
}

function addRow(tbody, r) {
  const verdict = r.pan_p50 <= 17 ? "smooth" : r.pan_p50 <= 34 ? "visible"
                : r.pan_p50 <= 100 ? "choppy" : "unusable";
  const cls = r.pan_p50 <= 17 ? "ok" : r.pan_p50 > 34 ? "bad" : "";
  const tr = document.createElement("tr");
  [r.strategy, r.trades.toLocaleString(), r.first.toFixed(1),
   r.pan_p50.toFixed(1), r.pan_p95.toFixed(1), r.fps.toFixed(0),
   r.drawn.toLocaleString(), verdict].forEach((v, i) => {
    const td = document.createElement("td");
    td.textContent = v;
    if (i === 3 || i === 7) td.className = cls;
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
}

document.getElementById("go").addEventListener("click", run);
if (location.search.includes("auto")) run();
</script>
